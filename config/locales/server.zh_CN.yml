      already_scored: "你已经给这个对象打过分了。想重新打分的话，请先删除原来的打分。"
      reply_to_item_not_allowed: "直接回复评分对象必须打分，请用「我来打分」发短评；要回复别人的短评，请点那条短评下面的回复按钮。"
      cannot_submit: "你现在不能提交评分主题或评分对象。"
      duplicate_names: "评分对象不能重名。"
      name_taken: "这个评分主题里已经有同名的评分对象了。"
      image_invalid: "请为每个评分对象上传一张图片。"
      image_missing: "有图片已经被删除，无法发布。"
      publish_failed: "发布失败，请稍后再试。"
      comment_required: "说点什么吧～"
      comment_length: "短评要在 %{min}–%{max} 字之间。"
      review_deleted: "这条短评已经删除，不能再回复了。"
      reply_length: "回复要在 1–%{max} 字之间。"
  discourse_kuu_ratings:
    reviewables:
      actions:
        approve_kuu_rating_submission:
          title: "批准"
          description: "发布这个评分主题（连同所有评分对象）或这个评分对象。"
        reject_kuu_rating_submission:
          title: "拒绝"
          description: "不发布，并私信通知提交人。"
  system_messages:
    kuu_rating_submission_rejected:
      title: "评分内容未通过审核"
      subject_template: "你提交的评分内容没有通过审核"
      text_body_template: |
        你好，

        你提交的「%{name}」没有通过管理员审核，所以不会发布到论坛上。

        评分只收店铺、地点、服务和生活中的各种「概念」，不评具体的人，也不评课程和研究室。图片请用自己拍的，或者确认可以使用的。

        有疑问的话，可以私信管理员。
